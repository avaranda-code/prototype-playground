<!DOCTYPE html>
<html class="staticrypt-html" lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Psst! Got the password?</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- favicon -->
    <link rel="icon" type="image/png" href="/prototype-playground/images/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/prototype-playground/images/favicon.png?v=2" />

    <!-- do not cache this page -->
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&display=swap"
      rel="stylesheet"
    />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg: #F8F7F6;
        --surface: #FFFFFF;
        --accent: #683FCF;
        --accent-light: #8B6AD8;
        --text-primary: #1A1A1A;
        --text-secondary: #6B6B6B;
        --text-tertiary: #9A9A9A;
        --border: rgba(0, 0, 0, 0.06);
      }

      html, body { height: 100%; }

      body {
        background: var(--bg);
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        position: relative;
      }

      /* Floating decorative blobs */
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
        pointer-events: none;
        animation: float 22s ease-in-out infinite;
        z-index: 0;
      }
      .blob-1 {
        width: 380px; height: 380px;
        background: #B59BE8;
        top: -100px; left: -120px;
        opacity: 0.45;
      }
      .blob-2 {
        width: 320px; height: 320px;
        background: #FFB8E0;
        bottom: -90px; right: -100px;
        opacity: 0.4;
        animation-delay: -8s;
      }
      .blob-3 {
        width: 240px; height: 240px;
        background: #683FCF;
        top: 55%; right: 14%;
        opacity: 0.18;
        animation-delay: -15s;
      }

      @keyframes float {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33%      { transform: translate(40px, -30px) scale(1.06); }
        66%      { transform: translate(-30px, 40px) scale(0.94); }
      }

      /* Loading spinner */
      .staticrypt-spinner-container {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .staticrypt-spinner {
        width: 2rem; height: 2rem;
        border: 0.25em solid #d4c5f0;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spinner-border 0.75s linear infinite;
      }
      @keyframes spinner-border { 100% { transform: rotate(360deg); } }

      /* Layout */
      .staticrypt-content {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        position: relative;
        z-index: 1;
      }
      .staticrypt-page {
        width: 100%;
        max-width: 420px;
      }

      /* Card */
      .staticrypt-form {
        background: var(--surface);
        border-radius: 24px;
        border: 1px solid var(--border);
        padding: 36px 32px 28px;
        text-align: center;
        box-shadow: 0 24px 48px rgba(104, 63, 207, 0.10), 0 8px 16px rgba(0, 0, 0, 0.04);
        animation: cardIn 0.6s cubic-bezier(0.2, 0, 0, 1);
      }
      @keyframes cardIn {
        from { opacity: 0; transform: translateY(20px) scale(0.96); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      /* Dog avatar — bobs gently above the card */
      .dog-wrap {
        width: 140px; height: 140px;
        margin: -86px auto 14px;
        position: relative;
        animation: bob 4.5s ease-in-out infinite;
      }
      .dog-img {
        width: 100%; height: 100%;
        border-radius: 50%;
        background: #F0E8FA url('/prototype-playground/images/favicon.png?v=2') center/cover no-repeat;
        box-shadow: 0 10px 28px rgba(104, 63, 207, 0.28), 0 2px 6px rgba(0, 0, 0, 0.06);
        border: 5px solid var(--surface);
      }
      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-6px); }
      }

      /* Text */
      .staticrypt-instructions {
        margin-bottom: 22px;
      }
      .staticrypt-title {
        font-size: 21px;
        font-weight: 650;
        letter-spacing: -0.025em;
        color: var(--text-primary);
        margin-bottom: 6px;
      }
      .staticrypt-instructions p:last-child {
        font-size: 13.5px;
        color: var(--text-secondary);
        line-height: 1.5;
      }

      /* Password input */
      .staticrypt-password-container {
        position: relative;
        margin-bottom: 12px;
      }
      .staticrypt-form input[type="password"],
      .staticrypt-form input[type="text"] {
        width: 100%;
        padding: 14px 44px 14px 18px;
        border-radius: 12px;
        border: 1.5px solid var(--border);
        background: var(--bg);
        color: var(--text-primary);
        font-size: 14.5px;
        font-family: inherit;
        outline: none;
        transition: all 0.15s ease;
      }
      .staticrypt-form input[type="password"]::placeholder,
      .staticrypt-form input[type="text"]::placeholder {
        color: var(--text-tertiary);
      }
      .staticrypt-form input[type="password"]:focus,
      .staticrypt-form input[type="text"]:focus {
        border-color: var(--accent);
        background: var(--surface);
        box-shadow: 0 0 0 4px rgba(104, 63, 207, 0.10);
      }

      /* Show/hide password toggle */
      .staticrypt-toggle-password-visibility {
        cursor: pointer;
        height: 18px;
        opacity: 0.45;
        padding: 12px;
        position: absolute;
        right: 4px;
        top: 50%;
        transform: translateY(-50%);
        width: 18px;
        transition: opacity 0.15s ease;
      }
      .staticrypt-toggle-password-visibility:hover { opacity: 0.75; }

      /* Remember me */
      label.staticrypt-remember {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-bottom: 16px;
        font-size: 13px;
        color: var(--text-secondary);
        cursor: pointer;
      }
      .staticrypt-remember input[type="checkbox"] {
        width: 15px; height: 15px;
        accent-color: var(--accent);
        cursor: pointer;
      }

      /* Submit button */
      .staticrypt-decrypt-button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), var(--accent-light));
        color: white;
        font-size: 14.5px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        letter-spacing: 0.02em;
        transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
        box-shadow: 0 4px 12px rgba(104, 63, 207, 0.28);
      }
      .staticrypt-decrypt-button:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 18px rgba(104, 63, 207, 0.38);
        filter: brightness(1.05);
      }
      .staticrypt-decrypt-button:active {
        transform: translateY(0);
        box-shadow: 0 2px 8px rgba(104, 63, 207, 0.25);
      }

      /* Footer */
      .footer-line {
        margin-top: 22px;
        font-size: 11px;
        color: var(--text-tertiary);
        letter-spacing: 0.08em;
        font-family: 'DM Mono', 'SF Mono', monospace;
        text-transform: uppercase;
      }

      .hidden { display: none !important; }

      @media (max-width: 480px) {
        .staticrypt-form { padding: 32px 24px 26px; border-radius: 20px; }
        .dog-wrap { width: 120px; height: 120px; margin-top: -72px; }
        .staticrypt-title { font-size: 20px; }
      }
    </style>
  </head>
