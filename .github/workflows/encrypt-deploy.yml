name: Encrypt & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install StatiCrypt
        run: npm install -g staticrypt

      - name: Encrypt HTML files
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          # Use a fixed salt across every encrypted file so they all share
          # the same cached decryption key in localStorage. Without this,
          # StatiCrypt generates a fresh per-file salt and the user is
          # prompted once per page (e.g. once for viewer.html, again for the
          # prototype iframe). The salt is not a secret — its only job is to
          # prevent rainbow-table attacks; security comes from the password.
          SALT="f7c8a2b91d4e6a5c3b8d7e2f9a1c4b6d"
          find . -name "*.html" \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            -not -name "password_template.html" | while read file; do
              echo "Encrypting $file"
              tmpdir=$(mktemp -d)
              staticrypt "$file" \
                --password "$STATICRYPT_PASSWORD" \
                --salt "$SALT" \
                --remember 1 \
                --short \
                --template password_template.html \
                --template-title "Psst! Got the password?" \
                --template-instructions "Just a quick check before you come in." \
                --template-placeholder "the secret word..." \
                --template-button "Let me in" \
                --template-remember "Remember me next time" \
                --template-error "Hmm, that's not it. Try again?" \
                -d "$tmpdir"
              mv "$tmpdir/$(basename $file)" "$file"
              rm -rf "$tmpdir"
          done

      - name: Verify encryption
        run: |
          echo "--- index.html title ---"
          grep -m1 "<title>" ./index.html

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
