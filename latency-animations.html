<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latency animations — 10s loading states for the Shopping Assistant</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Sacramento&family=Fredoka:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: 231 45% 46%;
    --chat-text: 220 20% 15%;
    --chat-text-muted: 220 10% 40%;
    --background: 220 10% 95%;
    --chat-glow: 231 45% 46% / 0.3;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: hsl(var(--background));
    color: hsl(var(--chat-text));
    min-height: 100vh;
    padding: 40px 24px;
  }

  .wrap { max-width: 1280px; margin: 0 auto; }
  .row {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 56px; align-items: flex-start;
  }
  .row-brands { margin-bottom: 72px; }
  .row-1 { margin-bottom: 56px; }
  .row-2 { margin-bottom: 80px; }
  .row-3 { margin-bottom: 80px; }
  .section-title { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; color: hsl(var(--chat-text-muted)); text-align: center; margin-bottom: 24px; letter-spacing: 0.5px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 280px; }
  .cell-label { font-size: 12px; font-weight: 600; color: hsl(var(--chat-text-muted)); text-align: center; white-space: nowrap; }

  /* ─── CHAT CARD (ConversationShell) ─── */
  .card {
    position: relative;
    width: 280px; height: 600px;
    border-radius: 24px; overflow: hidden;
    display: flex; flex-direction: column;
    background: linear-gradient(to bottom, hsl(0 0% 98%), hsl(220 14% 96%));
  }
  .chat-bg {
    position: absolute; left: -116%; top: -54%;
    width: 333%; height: 207%; z-index: -10;
  }

  .chat-glass {
    background: hsl(0 0% 100% / 0.2);
    box-shadow: 0px 2px 3px hsl(0 0% 0% / 0.1);
    border-radius: 24px;
  }
  .chat-glass-input {
    background: hsl(0 0% 100% / 0.4);
    box-shadow: 0px 0px 30px hsl(var(--chat-glow)), 0px 2px 3px hsl(0 0% 0% / 0.1);
    border-radius: 24px;
  }

  .header {
    position: relative; z-index: 10;
    display: flex; align-items: center; gap: 6px;
    padding: 24px 12px 8px;
    backdrop-filter: blur(5px);
  }
  .icon-btn { padding: 8px; display: flex; align-items: center; justify-content: center; }
  .header svg.lucide { stroke: hsl(var(--chat-text)); }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .track-pill { padding: 8px 12px; display: flex; align-items: center; gap: 4px; }
  .track-pill span { font-size: 11px; font-weight: 500; color: hsl(var(--chat-text)); white-space: nowrap; }

  .logo-area { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 16px 4px; }
  .logo-area svg { width: 85%; height: auto; }
  .logo-sub { font-size: 9px; color: hsl(var(--chat-text-muted)); text-align: center; line-height: 1.2; }
  .logo-sub .u { text-decoration: underline; }

  .convo {
    flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
    padding: 0 12px 64px; gap: 8px; position: relative;
  }
  .user-row { display: flex; justify-content: flex-end; }
  .user-bubble {
    background: hsl(var(--primary) / 0.1);
    border-radius: 16px 16px 4px 16px;
    padding: 8px 12px; max-width: 85%;
  }
  .user-bubble span { font-size: 11px; color: hsl(var(--chat-text)); }

  .footer {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
    padding: 8px 12px 12px; backdrop-filter: blur(1px);
  }
  .input-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; }
  .input-bar .placeholder { font-size: 12px; color: hsl(var(--chat-text-muted)); flex: 1; }
  .input-bar svg.lucide { stroke: hsl(var(--chat-text)); }

  /* ─── shared dot helpers ─── */
  .anim-left { display: flex; justify-content: flex-start; }

  /* 1 · BounceDots */
  .bounce-wrap { display: flex; flex-direction: column; padding-left: 4px; gap: 12px; }
  .bounce-row { display: flex; align-items: center; gap: 4px; padding-left: 7px; }
  .bounce-dot {
    display: block; width: 6px; height: 6px; border-radius: 50%;
    background: hsl(var(--chat-text-muted) / 0.6);
    animation: human-wave-pulse 1.4s ease-in-out infinite;
  }
  @keyframes human-wave-pulse {
    0%, 100% { transform: scale(0.6); opacity: 0.3; }
    50% { transform: scale(1.3); opacity: 1; }
  }

  /* 6 · RippleDots */
  .ripple-row { display: flex; align-items: center; gap: 5px; }
  .ripple-dot { position: relative; display: block; width: 6px; height: 6px; }
  .ripple-ring { position: absolute; inset: 0; border-radius: 50%; background: hsl(var(--primary) / 0.3); animation: ripple-ring 2s ease-out infinite; }
  .ripple-core { position: absolute; inset: 1px; border-radius: 50%; background: hsl(var(--primary)); animation: ripple-core 2s ease-in-out infinite; }
  @keyframes ripple-ring {
    0%, 100% { transform: scale(1); opacity: 0; }
    30% { transform: scale(2.2); opacity: 0.5; }
    60% { transform: scale(3); opacity: 0; }
  }
  @keyframes ripple-core {
    0%, 100% { transform: scale(0.6); opacity: 0.3; }
    30% { transform: scale(1); opacity: 1; }
    60% { transform: scale(0.6); opacity: 0.3; }
  }

  /* 7 · SweepDot */
  .sweep-wrap { display: flex; flex-direction: column; padding-left: 4px; gap: 12px; }
  .sweep-track { position: relative; padding-left: 7px; height: 8px; width: 44px; }
  .sweep-dot {
    position: absolute; top: 50%; left: 0; display: block;
    width: 7px; height: 7px; border-radius: 50%; background: hsl(var(--primary));
    animation: sweep-dot 1.6s ease-in-out infinite;
  }
  @keyframes sweep-dot {
    0% { transform: translate(0, -50%); }
    50% { transform: translate(30px, -50%); }
    100% { transform: translate(0, -50%); }
  }

  /* 8 · StarBreath */
  .breath-wrap { display: flex; justify-content: flex-start; padding-left: 4px; }
  .breath-bars { display: flex; flex-direction: column; gap: 3px; }
  .breath-bar { display: block; height: 3px; border-radius: 9999px; animation: breath-bar 2.4s ease-in-out infinite; transform-origin: left; }
  .breath-bar.b1 { width: 48px; background: hsl(var(--primary) / 0.4); }
  .breath-bar.b2 { width: 32px; background: hsl(var(--primary) / 0.25); animation-delay: 0.3s; }
  @keyframes breath-bar {
    0%, 100% { opacity: 0.2; transform: scaleX(0.6); }
    50% { opacity: 0.7; transform: scaleX(1); }
  }

  /* 9 · TravellingWave */
  .twave-row { display: flex; align-items: center; gap: 4px; padding-left: 7px; }
  .twave-dot { display: block; width: 6px; height: 6px; border-radius: 50%; background: hsl(var(--primary)); animation: twave 1.3s ease-in-out infinite; }
  @keyframes twave { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-5px); } }

  /* 10 · SonarPing */
  .sonar-wrap { padding-left: 8px; }
  .sonar { position: relative; display: block; width: 8px; height: 8px; }
  .sonar-core { position: absolute; inset: 0; border-radius: 50%; background: hsl(var(--primary)); }
  .sonar-ping { position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid hsl(var(--primary)); animation: sonar-ping 1.6s cubic-bezier(0,0,.2,1) infinite; }
  @keyframes sonar-ping { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(2.8); opacity: 0; } }

  /* 11 · BreathingDot */
  .bdot-wrap { padding-left: 8px; }
  .bdot { display: block; width: 10px; height: 10px; border-radius: 50%; background: hsl(var(--primary)); animation: bdot 2.2s ease-in-out infinite; }
  @keyframes bdot { 0%, 100% { transform: scale(0.65); opacity: 0.4; } 50% { transform: scale(1.15); opacity: 1; } }

  /* 12 · Equalizer */
  .eq-row { display: flex; align-items: flex-end; gap: 3px; height: 16px; padding-left: 7px; }
  .eq-bar { display: block; width: 3px; border-radius: 2px; background: hsl(var(--primary)); animation: eq-bar 1s ease-in-out infinite; }
  @keyframes eq-bar { 0%, 100% { height: 4px; } 50% { height: 16px; } }

  /* 13 · OrbitDots */
  .orbit-wrap { padding-left: 8px; }
  .orbit { position: relative; display: block; width: 18px; height: 18px; animation: orbit-spin 1.4s linear infinite; }
  .orbit-dot { position: absolute; left: 6px; width: 6px; height: 6px; border-radius: 50%; background: hsl(var(--primary)); }
  .orbit-dot.top { top: 0; }
  .orbit-dot.bottom { bottom: 0; opacity: 0.55; }
  @keyframes orbit-spin { to { transform: rotate(360deg); } }

  /* 14 · ShimmerSweep */
  .shimmer-wrap { padding-left: 7px; }
  .shimmer { position: relative; display: block; width: 44px; height: 5px; border-radius: 3px; background: hsl(var(--primary) / 0.2); overflow: hidden; }
  .shimmer::after { content: ""; position: absolute; top: 0; left: -40%; width: 40%; height: 100%; border-radius: 3px; background: hsl(var(--primary)); animation: shimmer-sweep 1.4s ease-in-out infinite; }
  @keyframes shimmer-sweep { 0% { left: -40%; } 100% { left: 100%; } }

  /* ─── slot-machine thinking phrases ─── */
  .phrase-window { height: 18px; overflow: hidden; padding-left: 8px; margin-bottom: 2px; }
  .phrase-track { display: flex; flex-direction: column; animation: slot 14s cubic-bezier(.7,0,.2,1) infinite; }
  .phrase { height: 18px; line-height: 18px; font-size: 11px; font-weight: 500; color: hsl(var(--primary)); white-space: nowrap; }
  @keyframes slot {
    0%, 9%       { transform: translateY(0); }
    12.5%, 21.5% { transform: translateY(-18px); }
    25%, 34%     { transform: translateY(-36px); }
    37.5%, 46.5% { transform: translateY(-54px); }
    50%, 59%     { transform: translateY(-72px); }
    62.5%, 71.5% { transform: translateY(-90px); }
    75%, 84%     { transform: translateY(-108px); }
    87.5%, 96.5% { transform: translateY(-126px); }
    100%         { transform: translateY(-144px); }
  }

  /* ─── typed-out thinking phrases (letters ripple in, borrows variation 1's bounce) ─── */
  .phrase-type { height: 18px; padding-left: 8px; margin-bottom: 2px; white-space: pre; }
  .phrase-type .ch {
    display: inline-block; font-size: 11px; font-weight: 500; line-height: 18px;
    color: hsl(var(--primary)); white-space: pre; transform-origin: center bottom;
    opacity: 0.3; transform: scale(0.7);
    animation: letter-bounce-in 0.55s ease-in-out forwards;
  }
  @keyframes letter-bounce-in {
    0%   { opacity: 0.3; transform: scale(0.7); }
    55%  { opacity: 1;   transform: scale(1.1); }
    100% { opacity: 1;   transform: scale(1); }
  }
  .phrase-type .ch.deleting {
    animation: letter-pop-out 0.28s ease-in-out forwards;
  }
  @keyframes letter-pop-out {
    0%   { opacity: 1;   transform: scale(1); }
    45%  { opacity: 1;   transform: scale(1.1); }
    100% { opacity: 0.3; transform: scale(0.7); }
  }

  /* ─── Sami Jewels brand skin (warm-brown widget) ─── */
  .card.sami {
    --primary: 0 0% 100%;
    --chat-text: 0 0% 100%;
    --chat-text-muted: 28 24% 88%;
    --chat-glow: 0 0% 100% / 0.18;
    background: linear-gradient(to bottom, #71625a, #5a4d46);
  }
  .card.sami .chat-bg { display: none; }
  /* header pills: cream/white with warm-brown icons, like the real widget */
  .card.sami .chat-glass { background: hsl(36 30% 96% / 0.92); box-shadow: 0px 2px 4px hsl(25 30% 18% / 0.22); }
  .card.sami .header svg.lucide { stroke: #4a3f39; }
  .card.sami .track-pill span { color: #4a3f39; }
  /* input bar: soft translucent on brown */
  .card.sami .chat-glass-input { background: hsl(36 24% 92% / 0.16); box-shadow: 0px 2px 3px hsl(25 30% 18% / 0.22); }
  /* logo */
  .sami-logo { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .sami-script { font-family: 'Sacramento', cursive; font-size: 44px; line-height: 0.9; color: #fff; }
  .sami-logo .sami-heart { width: 30px; height: 26px; margin-top: 8px; }
  .sami-jewels { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 7px; color: #fff; margin-top: -2px; padding-left: 7px; text-align: center; }

  /* ─── Parachute brand skin (light-brown linen widget) ─── */
  .card.parachute {
    --primary: 25 28% 30%;        /* warm dark brown — dots/accents */
    --chat-text: 25 22% 22%;      /* near-black brown text */
    --chat-text-muted: 26 14% 36%;
    --chat-glow: 25 28% 38% / 0.12;
    background: linear-gradient(to bottom, #d9c9b6, #c6b29a);
  }
  .card.parachute .chat-bg { display: none; }
  .card.parachute .chat-glass { background: hsl(40 33% 97% / 0.55); box-shadow: 0px 1px 3px hsl(28 25% 22% / 0.16); }
  .card.parachute .header svg.lucide { stroke: #36302a; }
  .card.parachute .track-pill span { color: #36302a; }
  .card.parachute .chat-glass-input { background: hsl(40 30% 96% / 0.32); box-shadow: 0px 1px 3px hsl(28 25% 22% / 0.16); }
  .parachute-logo { font-family: 'Inter', sans-serif; font-weight: 300; font-size: 21px; letter-spacing: 8px; color: #2a241f; padding-left: 8px; text-align: center; }

  /* ─── Toys R Us brand skin (bright blue gradient, playful) ─── */
  .card.toysrus {
    --primary: 0 0% 100%;          /* white dots on bright blue */
    --chat-text: 0 0% 100%;
    --chat-text-muted: 210 70% 93%;
    --chat-glow: 0 0% 100% / 0.25;
    background: linear-gradient(to bottom, #2e9bff, #0a57d6);
  }
  .card.toysrus .chat-bg { display: none; }
  .card.toysrus .chat-glass { background: hsl(0 0% 100% / 0.95); box-shadow: 0px 2px 5px hsl(220 70% 18% / 0.28); }
  .card.toysrus .header svg.lucide { stroke: #0a57d6; }
  .card.toysrus .track-pill span { color: #0a57d6; }
  .card.toysrus .chat-glass-input { background: hsl(0 0% 100% / 0.18); box-shadow: 0px 2px 4px hsl(220 70% 18% / 0.22); }
  .toysrus-logo { font-family: 'Fredoka', 'Inter', sans-serif; font-weight: 600; font-size: 34px; letter-spacing: 1px; text-align: center; line-height: 1; padding-left: 4px; }
  .toysrus-logo span { -webkit-text-stroke: 2.5px #fff; paint-order: stroke fill; }
  .tru-pink { color: #ec008c; }
  .tru-orange { color: #f58220; }
  .tru-green { color: #7ac143; }
  .tru-r { color: #1c3fd6; display: inline-block; transform: scaleX(-1); -webkit-text-stroke: 3px #fff; }

  /* ─── Glamnetic brand skin (pink) + split-by-character text animation ─── */
  .card.glamnetic {
    --primary: 330 82% 56%;
    --chat-text: 0 0% 100%;
    --chat-text-muted: 330 70% 96%;
    --chat-glow: 330 82% 60% / 0.25;
    background: linear-gradient(to bottom, #ff8fc4, #f1559e);
  }
  .card.glamnetic .chat-bg { display: none; }
  .card.glamnetic .chat-glass { background: hsl(0 0% 100% / 0.94); box-shadow: 0px 2px 5px hsl(330 55% 28% / 0.25); }
  .card.glamnetic .header svg.lucide { stroke: #d6357f; }
  .card.glamnetic .track-pill span { color: #d6357f; }
  .card.glamnetic .chat-glass-input { background: hsl(0 0% 100% / 0.2); box-shadow: 0px 2px 4px hsl(330 55% 28% / 0.2); }
  .glamnetic-logo { font-family: 'Inter', sans-serif; font-size: 26px; letter-spacing: 1px; color: #fff; text-align: center; line-height: 1; }
  .glamnetic-logo .g1 { font-weight: 800; }
  .glamnetic-logo .g2 { font-weight: 400; }
  /* split-by-character phrase row (GSAP-animated) */
  .phrase-split { height: 20px; padding-left: 8px; font-size: 12px; font-weight: 500; line-height: 20px; color: #fff; white-space: nowrap; }
  .phrase-split .sc { display: inline-block; white-space: pre; }

  /* ─── OSEA Malibu brand skin (coastal seafoam, clean + calm) ─── */
  .card.osea {
    --primary: 172 32% 25%;
    --chat-text: 172 32% 18%;
    --chat-text-muted: 172 15% 38%;
    --chat-glow: 172 32% 30% / 0.15;
    background: linear-gradient(to bottom, #dcebe7, #b6d4cc);
  }
  .card.osea .chat-bg { display: none; }
  .card.osea .chat-glass { background: hsl(160 25% 98% / 0.78); box-shadow: 0px 1px 3px hsl(172 30% 20% / 0.18); }
  .card.osea .header svg.lucide { stroke: #1d4a43; }
  .card.osea .track-pill span { color: #1d4a43; }
  .card.osea .chat-glass-input { background: hsl(160 25% 97% / 0.4); box-shadow: 0px 1px 3px hsl(172 30% 20% / 0.18); }
  .osea-logo { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 26px; letter-spacing: 11px; color: #143d38; padding-left: 11px; text-align: center; }

  /* ─── ATELIER brand skin (quiet-luxury cream, serif — Brunello Cucinelli-inspired) ─── */
  .card.atelier {
    --primary: 32 10% 28%;
    --chat-text: 32 12% 16%;
    --chat-text-muted: 32 8% 38%;
    --chat-glow: 32 12% 30% / 0.1;
    background: linear-gradient(to bottom, #f4f1ea, #e7e1d4);
  }
  .card.atelier .chat-bg { display: none; }
  .card.atelier .chat-glass { background: hsl(42 30% 97% / 0.8); box-shadow: 0px 1px 3px hsl(32 15% 25% / 0.15); }
  .card.atelier .header svg.lucide { stroke: #3b342c; }
  .card.atelier .track-pill span { color: #3b342c; }
  .card.atelier .chat-glass-input { background: hsl(42 28% 96% / 0.45); box-shadow: 0px 1px 3px hsl(32 15% 25% / 0.15); }
  .atelier-logo { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 21px; letter-spacing: 7px; color: #2b2620; text-align: center; padding-left: 7px; }
  .atelier-logo .crest { display: block; font-size: 13px; letter-spacing: 2px; color: #6b6157; margin-bottom: 1px; font-weight: 500; }

  /* ─── Atelier interstitial loaders: full-stage, serif copy cycling, ornament animating ─── */
  .stage.atl {
    background: none; height: 230px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  }
  .atl-copy {
    font-family: 'Cormorant Garamond', serif; font-size: 17.5px; font-weight: 500; color: #2b2620;
    text-align: center; height: 22px; opacity: 0; transition: opacity .7s;
  }
  .atl-orn svg { display: block; }
  .atl-orn path { fill: none; stroke: #6b6157; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  /* draw-in ornaments (skyline, silhouette): the illustration sketches itself over the load */
  .atl-draw path { stroke-dasharray: 100; stroke-dashoffset: 100; }
  .stage.on .atl-draw path { animation: atlDraw 8s cubic-bezier(.4, 0, .3, 1) forwards; }
  @keyframes atlDraw { to { stroke-dashoffset: 0; } }
  /* infinity ribbon: the house motif draws itself endlessly */
  .atl-ribbon path { stroke-dasharray: 62 38; animation: atlFlow 2.8s linear infinite; }
  @keyframes atlFlow { to { stroke-dashoffset: -100; } }
  /* gold dust: a drifting constellation of sparkle */
  .atl-stars { position: relative; width: 210px; height: 84px; }
  .atl-stars .atl-star-core {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: 22px; color: #b49b62; animation: atlBreath 2.4s ease-in-out infinite;
  }
  @keyframes atlBreath { 0%, 100% { opacity: .5; transform: translate(-50%, -50%) scale(.8) rotate(0deg); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15) rotate(22deg); } }
  .atl-stars i { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #b49b62; animation: atlTwinkle 2.6s ease-in-out infinite; }
  .atl-stars i:nth-child(2) { left: 12%; top: 30%; animation-delay: .2s; }
  .atl-stars i:nth-child(3) { left: 26%; top: 68%; animation-delay: 1.1s; }
  .atl-stars i:nth-child(4) { left: 38%; top: 18%; animation-delay: .6s; }
  .atl-stars i:nth-child(5) { left: 62%; top: 74%; animation-delay: 1.5s; }
  .atl-stars i:nth-child(6) { left: 74%; top: 24%; animation-delay: .9s; }
  .atl-stars i:nth-child(7) { left: 88%; top: 55%; animation-delay: .35s; }
  .atl-stars i:nth-child(8) { left: 50%; top: 10%; animation-delay: 1.8s; }
  .atl-stars i:nth-child(9) { left: 8%; top: 78%; animation-delay: 1.3s; }
  @keyframes atlTwinkle { 0%, 100% { opacity: .1; transform: scale(.5); } 50% { opacity: 1; transform: scale(1.4); } }

  /* ─── Abstract loaders: pure motion, brand-agnostic ─── */
  .stage.abs { background: none; height: 230px; display: flex; align-items: center; justify-content: center; }
  /* 1 · Liquid thought — an organic blob slowly morphing and turning */
  .ab-blob {
    width: 92px; height: 92px;
    background: linear-gradient(135deg, hsl(38 28% 76%), hsl(33 18% 52%));
    animation: abMorph 6.5s ease-in-out infinite, abTurn 16s linear infinite;
    box-shadow: 0 10px 30px hsl(33 20% 40% / 0.25);
  }
  @keyframes abMorph {
    0%, 100% { border-radius: 58% 42% 63% 37% / 45% 55% 40% 60%; }
    33%      { border-radius: 40% 60% 45% 55% / 60% 38% 62% 40%; }
    66%      { border-radius: 55% 45% 38% 62% / 42% 58% 55% 45%; }
  }
  @keyframes abTurn { to { rotate: 360deg; } }
  /* 2 · Quiet orbits — nested arcs circling at different speeds */
  .ab-orbits { position: relative; width: 110px; height: 110px; }
  .ab-orbits i { position: absolute; border-radius: 50%; border: 1.5px solid transparent; }
  .ab-orbits i:nth-child(1) { inset: 0;    border-top-color: hsl(33 20% 45%); border-right-color: hsl(33 20% 45% / .25); animation: abOrbit 3.2s linear infinite; }
  .ab-orbits i:nth-child(2) { inset: 16px; border-top-color: hsl(38 24% 60%); border-left-color: hsl(38 24% 60% / .25); animation: abOrbit 2.2s linear infinite reverse; }
  .ab-orbits i:nth-child(3) { inset: 32px; border-top-color: hsl(30 15% 35%); animation: abOrbit 4.6s linear infinite; }
  .ab-orbits .ab-core {
    position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px;
    border-radius: 50%; background: hsl(30 15% 35%); animation: abPulse 2s ease-in-out infinite;
  }
  @keyframes abOrbit { to { transform: rotate(360deg); } }
  @keyframes abPulse { 0%, 100% { transform: scale(.7); opacity: .5; } 50% { transform: scale(1.2); opacity: 1; } }
  /* 3 · Ripple field — a 5×5 dot matrix pulsing in waves from the center */
  .ab-field { display: grid; grid-template-columns: repeat(5, 22px); grid-auto-rows: 22px; gap: 4px; }
  .ab-field i {
    width: 8px; height: 8px; margin: auto; border-radius: 50%;
    background: hsl(33 20% 48%); animation: abRipple 2.4s ease-in-out infinite;
  }
  @keyframes abRipple { 0%, 100% { transform: scale(.45); opacity: .25; } 40% { transform: scale(1.35); opacity: 1; } }
  /* 4 · Juggle — three balls bouncing in round, squash & stretch */
  .ab-juggle { position: relative; width: 128px; height: 92px; }
  .ab-juggle i {
    position: absolute; bottom: 6px; width: 17px; height: 17px; border-radius: 50%;
    animation: abBounce .6s cubic-bezier(.35, 0, .65, 1) infinite alternate;
  }
  .ab-juggle i:nth-child(1) { left: 10px;  background: #fff;     animation-delay: 0s; }
  .ab-juggle i:nth-child(2) { left: 56px;  background: #ffd166;  animation-delay: .2s; }
  .ab-juggle i:nth-child(3) { left: 102px; background: #ff8fab;  animation-delay: .4s; }
  @keyframes abBounce {
    0%   { transform: translateY(0) scale(1.3, .7); }
    18%  { transform: translateY(-8px) scale(.92, 1.1); }
    100% { transform: translateY(-56px) scale(1, 1); }
  }
  /* 5 · Shape hopscotch — a little character hops and shapeshifts mid-air */
  .ab-hopwrap { position: relative; width: 60px; height: 104px; }
  .ab-hopper {
    position: absolute; bottom: 12px; left: 8px; width: 44px; height: 44px; background: #fff;
    box-shadow: 0 3px 8px hsl(220 70% 18% / 0.25);
    animation: abHop 1.15s cubic-bezier(.35, 0, .6, 1) infinite alternate, abShape 4.6s ease-in-out infinite;
  }
  @keyframes abHop {
    0%   { transform: translateY(0) scale(1.28, .72) rotate(0deg); }
    22%  { transform: translateY(-10px) scale(.9, 1.12) rotate(20deg); }
    100% { transform: translateY(-52px) scale(1, 1) rotate(180deg); }
  }
  @keyframes abShape {
    0%, 100% { border-radius: 50%; }
    25%      { border-radius: 24% 76% 65% 35% / 62% 30% 70% 38%; }
    50%      { border-radius: 18%; }
    75%      { border-radius: 61% 39% 26% 74% / 36% 63% 37% 64%; }
  }
  .ab-hopwrap::after { /* landing shadow, breathing opposite the hop */
    content: ""; position: absolute; left: 10px; bottom: 4px; width: 40px; height: 7px;
    border-radius: 50%; background: hsl(220 70% 18% / 0.28);
    animation: abShadow 1.15s cubic-bezier(.35, 0, .6, 1) infinite alternate;
  }
  @keyframes abShadow { 0% { transform: scale(1.25); opacity: .8; } 100% { transform: scale(.5); opacity: .25; } }
  /* 6 · Chase train — a conga line of dots looping a lazy figure-eight */
  .ab-train { position: relative; width: 160px; height: 96px; }
  .ab-train i {
    position: absolute; border-radius: 50%; background: #fff;
    offset-path: path('M30,48 C30,16 76,16 80,48 C84,80 130,80 130,48 C130,16 84,16 80,48 C76,80 30,80 30,48 Z');
    animation: abChase 3.4s linear infinite;
  }
  .ab-train i:nth-child(1) { width: 15px; height: 15px; animation-delay: 0s; }
  .ab-train i:nth-child(2) { width: 12px; height: 12px; animation-delay: -.15s; opacity: .85; background: #ffd166; }
  .ab-train i:nth-child(3) { width: 10px; height: 10px; animation-delay: -.3s;  opacity: .7; }
  .ab-train i:nth-child(4) { width: 8px;  height: 8px;  animation-delay: -.45s; opacity: .55; background: #ff8fab; }
  .ab-train i:nth-child(5) { width: 6px;  height: 6px;  animation-delay: -.6s;  opacity: .4; }
  @keyframes abChase { to { offset-distance: 100%; } }
  /* 7 · Newton's cradle — end balls trade swings */
  .ab-cradle { position: relative; width: 130px; height: 96px; }
  .ab-cradle::before { content: ""; position: absolute; left: 6px; right: 6px; top: 0; height: 3px; border-radius: 2px; background: hsl(0 0% 100% / 0.75); }
  .ab-cradle .arm { position: absolute; top: 2px; width: 2px; height: 58px; background: hsl(0 0% 100% / 0.55); transform-origin: top center; }
  .ab-cradle .arm::after { content: ""; position: absolute; left: 50%; bottom: -14px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #fff; }
  .ab-cradle .arm:nth-child(1) { left: 28px; animation: abCradleL 1.7s ease-in-out infinite; }
  .ab-cradle .arm:nth-child(2) { left: 46px; }
  .ab-cradle .arm:nth-child(3) { left: 64px; }
  .ab-cradle .arm:nth-child(4) { left: 82px; }
  .ab-cradle .arm:nth-child(5) { left: 100px; animation: abCradleR 1.7s ease-in-out infinite; }
  .ab-cradle .arm:nth-child(1)::after { background: #ff8fab; }
  .ab-cradle .arm:nth-child(5)::after { background: #ffd166; }
  @keyframes abCradleL { 0%, 50%, 100% { rotate: 0deg; } 25% { rotate: -46deg; } }
  @keyframes abCradleR { 0%, 50%, 100% { rotate: 0deg; } 75% { rotate: 46deg; } }
  /* 8 · Block stack — blocks pile up, wobble, tumble, repeat */
  .ab-stackwrap { position: relative; width: 60px; height: 104px; }
  .ab-stackwrap i { position: absolute; left: 15px; bottom: 8px; width: 30px; height: 22px; border-radius: 6px; background: #fff; opacity: 0; }
  .ab-stackwrap i:nth-child(1) { animation: abStack1 3.9s cubic-bezier(.4, 0, .6, 1) infinite; }
  .ab-stackwrap i:nth-child(2) { background: #ffd166; animation: abStack2 3.9s cubic-bezier(.4, 0, .6, 1) infinite; }
  .ab-stackwrap i:nth-child(3) { background: #ff8fab; animation: abStack3 3.9s cubic-bezier(.4, 0, .6, 1) infinite; }
  @keyframes abStack1 {
    0% { transform: translateY(-96px); opacity: 0; } 8% { transform: translateY(0) scaleY(.8); opacity: 1; }
    11% { transform: translateY(0) scaleY(1); } 78% { transform: translateY(0) rotate(0); opacity: 1; }
    90%, 100% { transform: translateY(70px) rotate(-24deg); opacity: 0; }
  }
  @keyframes abStack2 {
    0%, 18% { transform: translateY(-96px); opacity: 0; } 26% { transform: translateY(-24px) scaleY(.8); opacity: 1; }
    29% { transform: translateY(-24px) scaleY(1); } 78% { transform: translateY(-24px) rotate(0); opacity: 1; }
    90%, 100% { transform: translateY(60px) translateX(18px) rotate(30deg); opacity: 0; }
  }
  @keyframes abStack3 {
    0%, 36% { transform: translateY(-96px); opacity: 0; } 44% { transform: translateY(-48px) scaleY(.8); opacity: 1; }
    47% { transform: translateY(-48px) scaleY(1); } 74% { transform: translateY(-48px) rotate(0); opacity: 1; }
    78% { transform: translateY(-48px) rotate(7deg); }
    90%, 100% { transform: translateY(50px) translateX(-20px) rotate(-42deg); opacity: 0; }
  }
  /* 9 · Plinko — dots zigzag down an invisible peg board */
  .ab-plinko { position: relative; width: 110px; height: 104px; }
  .ab-plinko b { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: hsl(0 0% 100% / 0.35); }
  .ab-plinko span { position: absolute; left: 50%; top: 6px; width: 13px; height: 13px; margin-left: -6.5px; border-radius: 50%; background: #fff; animation: abPlinko 3.3s cubic-bezier(.5, 0, .8, .4) infinite; }
  .ab-plinko span:nth-of-type(2) { background: #ffd166; animation-delay: -1.1s; }
  .ab-plinko span:nth-of-type(3) { background: #ff8fab; animation-delay: -2.2s; }
  @keyframes abPlinko {
    0% { transform: translate(0, -14px); opacity: 0; }
    8% { transform: translate(0, 0); opacity: 1; }
    26% { transform: translate(-20px, 22px); }
    46% { transform: translate(14px, 44px); }
    66% { transform: translate(-12px, 66px); }
    86% { transform: translate(18px, 88px); opacity: 1; }
    100% { transform: translate(18px, 96px); opacity: 0; }
  }
  /* 10 · Domino wave — a kickline of tiles takes turns flipping */
  .ab-dominos { display: flex; gap: 9px; perspective: 300px; }
  .ab-dominos i { width: 13px; height: 46px; border-radius: 4px; background: #fff; animation: abDomino 2.6s ease-in-out infinite; }
  .ab-dominos i:nth-child(2) { animation-delay: .12s; }
  .ab-dominos i:nth-child(3) { animation-delay: .24s; background: #ffd166; }
  .ab-dominos i:nth-child(4) { animation-delay: .36s; }
  .ab-dominos i:nth-child(5) { animation-delay: .48s; background: #ff8fab; }
  .ab-dominos i:nth-child(6) { animation-delay: .6s; }
  @keyframes abDomino { 0%, 55%, 100% { transform: rotateY(0); } 20%, 35% { transform: rotateY(180deg); } }
  /* 10b · Domino shapeshift — the flip wave passes, then the whole line tips into a
     horizontal "ladder", waves again in its new orientation, and cartwheels back upright */
  .ab-dominos2 { display: flex; gap: 9px; perspective: 320px; }
  .ab-dominos2 i { width: 13px; height: 46px; border-radius: 4px; background: #fff; animation: abDomino2 5.2s cubic-bezier(.45, 0, .55, 1) infinite; }
  .ab-dominos2 i:nth-child(2) { animation-delay: .13s; }
  .ab-dominos2 i:nth-child(3) { animation-delay: .26s; background: #ffd166; }
  .ab-dominos2 i:nth-child(4) { animation-delay: .39s; }
  .ab-dominos2 i:nth-child(5) { animation-delay: .52s; background: #ff8fab; }
  .ab-dominos2 i:nth-child(6) { animation-delay: .65s; }
  @keyframes abDomino2 {
    0%        { transform: rotateY(0) rotate(0deg) scaleY(1); }
    7%        { transform: rotateY(180deg) rotate(0deg) scaleY(1); }    /* wave 1 rolls through */
    14%, 26%  { transform: rotateY(360deg) rotate(0deg) scaleY(1); }
    36%, 50%  { transform: rotateY(360deg) rotate(90deg) scaleY(.42); } /* tips over AND shrinks so the dashes don't overlap */
    58%       { transform: rotateY(540deg) rotate(90deg) scaleY(.42); } /* wave 2, in the new orientation */
    64%, 80%  { transform: rotateY(720deg) rotate(90deg) scaleY(.42); }
    92%, 100% { transform: rotateY(720deg) rotate(180deg) scaleY(1); }  /* cartwheels back upright, full size */
  }

  /* 8b · Block-stack shapes — 10s builds: blocks drop in and assemble a picture,
     enjoy a payoff moment, then scatter. Animations run only while the stage is on,
     so every round starts from the first block. */
  .bs { position: relative; }
  .bs i {
    position: absolute; top: -34px; left: var(--x); width: 20px; height: 20px;
    border-radius: 5px; background: var(--c); opacity: 0;
    box-shadow: 0 2px 5px hsl(220 70% 18% / 0.3);
  }
  .stage.on .bs i { animation: bsBuild 10s cubic-bezier(.5, 0, .5, 1) infinite; animation-delay: var(--d); }
  .stage.on .bs i.hold { animation-name: bsBuildHold; }
  .stage.on .bs i.wink { animation-name: bsBuildWink; }
  @keyframes bsBuild {
    0%       { transform: translateY(0); opacity: 0; }
    4%       { transform: translateY(var(--y)) scale(1.06, .78); opacity: 1; }
    7%       { transform: translateY(var(--y)) scale(1, 1); }
    80%      { transform: translateY(var(--y)) rotate(0deg); opacity: 1; }
    92%, 100% { transform: translate(var(--sx), calc(var(--y) + 120px)) rotate(var(--sr)); opacity: 0; }
  }
  @keyframes bsBuildHold {
    0%      { transform: translateY(0); opacity: 0; }
    4%      { transform: translateY(var(--y)) scale(1.06, .78); opacity: 1; }
    7%, 100% { transform: translateY(var(--y)); opacity: 1; }
  }
  @keyframes bsBuildWink { /* one eye winks twice before the scatter */
    0%       { transform: translateY(0); opacity: 0; }
    4%       { transform: translateY(var(--y)) scale(1.06, .78); opacity: 1; }
    7%       { transform: translateY(var(--y)) scale(1, 1); }
    64%      { transform: translateY(var(--y)) scaleY(1); }
    67%      { transform: translateY(var(--y)) scaleY(.12); }
    70%      { transform: translateY(var(--y)) scaleY(1); }
    74%      { transform: translateY(var(--y)) scaleY(.12); }
    77%      { transform: translateY(var(--y)) scaleY(1); }
    80%      { transform: translateY(var(--y)); opacity: 1; }
    92%, 100% { transform: translate(var(--sx), calc(var(--y) + 120px)) rotate(var(--sr)); opacity: 0; }
  }
  .stage.on .bs-heart { animation: bsHeartBeat 10s ease-in-out infinite; }
  @keyframes bsHeartBeat { /* two heartbeats once assembled */
    0%, 58%, 78%, 100% { transform: scale(1); }
    63% { transform: scale(1.1); }
    68% { transform: scale(1); }
    73% { transform: scale(1.12); }
  }
  .stage.on .bs-rocket { animation: bsLiftoff 10s ease-in-out infinite; }
  @keyframes bsLiftoff { /* rumble, then away it goes */
    0%, 60% { transform: translate(0, 0); opacity: 1; }
    63% { transform: translate(-2px, 0); }
    66% { transform: translate(2px, -2px); }
    69% { transform: translate(-2px, -1px); }
    72% { transform: translate(2px, -3px); }
    86% { transform: translate(0, -195px); opacity: 1; }
    88%, 100% { transform: translate(0, -215px); opacity: 0; }
  }
  .bs-rocket .flame {
    position: absolute; left: 50%; bottom: -16px; width: 14px; height: 17px; margin-left: -7px;
    border-radius: 50% 50% 50% 50% / 15% 15% 85% 85%;
    background: linear-gradient(#ffd166, #ff8fab); opacity: 0; transform-origin: top center;
  }
  .stage.on .bs-rocket .flame { animation: bsFlame 10s ease-in-out infinite; }
  @keyframes bsFlame {
    0%, 60% { opacity: 0; transform: scaleY(.2); }
    63% { opacity: 1; transform: scaleY(1); }
    67% { transform: scaleY(.65); }
    71% { transform: scaleY(1.2); }
    75% { transform: scaleY(.8); }
    80% { opacity: 1; transform: scaleY(1.3); }
    88%, 100% { opacity: 0; transform: scaleY(.2); }
  }

  /* 11 · Balloons — inflate, drift up, pop */
  .ab-balloons { position: relative; width: 120px; height: 104px; }
  .ab-balloons i { position: absolute; bottom: 4px; width: 22px; height: 26px; border-radius: 50% 50% 48% 52% / 58% 58% 42% 42%; animation: abBalloon 3.6s ease-in infinite; opacity: 0; }
  .ab-balloons i:nth-child(1) { left: 12px; background: #fff; }
  .ab-balloons i:nth-child(2) { left: 50px; background: #ffd166; animation-delay: 1.2s; }
  .ab-balloons i:nth-child(3) { left: 88px; background: #ff8fab; animation-delay: 2.4s; }
  @keyframes abBalloon {
    0% { transform: translate(0, 0) scale(.45); opacity: 0; }
    12% { transform: translate(-3px, -8px) scale(.7); opacity: 1; }
    48% { transform: translate(6px, -38px) scale(.92); }
    80% { transform: translate(-5px, -66px) scale(1); opacity: 1; }
    87% { transform: translate(-5px, -72px) scale(1.45); opacity: 0; }
    100% { opacity: 0; }
  }
  /* 13 · Bubbles — blown up from below, wobble as they rise, pop! */
  .ab-bubbles { position: relative; width: 134px; height: 108px; }
  .ab-bubbles i {
    position: absolute; bottom: 6px; border-radius: 50%; opacity: 0;
    border: 1.5px solid hsl(0 0% 100% / 0.9);
    background: radial-gradient(circle at 32% 28%, hsl(0 0% 100% / 0.55), hsl(0 0% 100% / 0.08) 45%);
    animation: abBubble ease-in infinite;
  }
  .ab-bubbles i:nth-child(1) { left: 12px;  width: 18px; height: 18px; animation-duration: 3.1s; }
  .ab-bubbles i:nth-child(2) { left: 44px;  width: 27px; height: 27px; animation-duration: 3.8s; animation-delay: .9s; }
  .ab-bubbles i:nth-child(3) { left: 84px;  width: 14px; height: 14px; animation-duration: 2.7s; animation-delay: 1.6s; }
  .ab-bubbles i:nth-child(4) { left: 106px; width: 22px; height: 22px; animation-duration: 3.4s; animation-delay: .4s; }
  .ab-bubbles i:nth-child(5) { left: 62px;  width: 12px; height: 12px; animation-duration: 2.5s; animation-delay: 2.2s; }
  @keyframes abBubble {
    0%   { transform: translate(0, 0) scale(.2); opacity: 0; }
    10%  { transform: translate(2px, -4px) scale(.65); opacity: 1; }   /* blown up… */
    18%  { transform: translate(-2px, -10px) scale(1); }               /* …fully inflated */
    45%  { transform: translate(6px, -34px) scale(1.03) skewX(2deg); } /* wobbly rise */
    70%  { transform: translate(-7px, -58px) scale(1); opacity: 1; }
    77%  { transform: translate(-7px, -65px) scale(1.4); opacity: 0; } /* pop! */
    100% { opacity: 0; }
  }

  /* 12 · Inchworm — stretch, scoot, repeat */
  .ab-worm { position: relative; width: 150px; height: 40px; }
  .ab-worm i {
    position: absolute; left: 0; bottom: 8px; width: 46px; height: 16px; border-radius: 9px;
    background: #fff; transform-origin: left center;
    animation: abWorm 3.2s cubic-bezier(.45, 0, .55, 1) infinite;
  }
  @keyframes abWorm {
    0%   { transform: translateX(0) scaleX(.42) scaleY(1.25); opacity: 1; }
    22%  { transform: translateX(0) scaleX(1) scaleY(.85); }
    50%  { transform: translateX(52px) scaleX(.42) scaleY(1.25); }
    72%  { transform: translateX(52px) scaleX(1) scaleY(.85); }
    94%  { transform: translateX(104px) scaleX(.42) scaleY(1.25); opacity: 1; }
    97%  { opacity: 0; }
    100% { transform: translateX(0) scaleX(.42) scaleY(1.25); opacity: 0; }
  }

  /* 14 · Aurora orb — a glass sphere with iridescent color swirling inside */
  .ab-glassorb {
    position: relative; width: 98px; height: 98px; border-radius: 50%; overflow: hidden;
    border: 1.5px solid hsl(0 0% 100% / 0.8);
    box-shadow: 0 14px 32px hsl(260 60% 50% / 0.2), inset 0 0 20px hsl(0 0% 100% / 0.35);
    animation: glassBreathe 3.4s ease-in-out infinite;
  }
  .ab-glassorb::before {
    content: ""; position: absolute; inset: -32%;
    background: conic-gradient(from 0deg, #8ec5ff, #c9a2ff, #ff9ad5, #ffd28f, #9df2d0, #8ec5ff);
    filter: blur(15px) saturate(1.25);
    animation: glassSpin 6s linear infinite;
  }
  .ab-glassorb::after { /* specular highlight — the glass */
    content: ""; position: absolute; left: 14%; top: 7%; width: 48%; height: 30%;
    border-radius: 50%; background: linear-gradient(hsl(0 0% 100% / 0.85), hsl(0 0% 100% / 0));
  }
  @keyframes glassSpin { to { rotate: 360deg; } }
  @keyframes glassBreathe { 0%, 100% { transform: scale(.94); } 50% { transform: scale(1.04); } }

  /* 15 · Aurora curtains — glass bars with color flowing through them */
  .ab-aurora { display: flex; align-items: center; gap: 11px; }
  .ab-aurora i {
    width: 27px; border-radius: 14px; border: 1px solid hsl(0 0% 100% / 0.65);
    background: linear-gradient(168deg, #8ec5ff, #c9a2ff 28%, #ff9ad5 52%, #ffd28f 76%, #9df2d0);
    background-size: 100% 320%; filter: saturate(1.15);
    box-shadow: inset 0 0 12px hsl(0 0% 100% / 0.4), 0 10px 22px hsl(260 60% 50% / 0.14);
    animation: auroraFlow 3.8s ease-in-out infinite alternate, auroraSway 5.2s ease-in-out infinite;
  }
  .ab-aurora i:nth-child(1) { height: 74px; }
  .ab-aurora i:nth-child(2) { height: 100px; animation-delay: .6s, .3s; }
  .ab-aurora i:nth-child(3) { height: 84px; animation-delay: 1.2s, .9s; }
  @keyframes auroraFlow { from { background-position: 0 0; } to { background-position: 0 100%; } }
  @keyframes auroraSway { 0%, 100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }

  /* 16 · Lava glass — translucent color blobs drifting into and out of each other */
  .ab-lava { position: relative; width: 136px; height: 104px; filter: saturate(1.2); }
  .ab-lava i {
    position: absolute; border: 1px solid hsl(0 0% 100% / 0.6);
    box-shadow: inset 0 0 14px hsl(0 0% 100% / 0.35), 0 10px 22px hsl(260 60% 50% / 0.12);
    animation: abMorph 7s ease-in-out infinite, lavaFloat ease-in-out infinite alternate;
  }
  .ab-lava i:nth-child(1) {
    left: 6px; top: 14px; width: 58px; height: 58px; animation-duration: 7s, 3.6s;
    background: radial-gradient(circle at 32% 26%, hsl(0 0% 100% / 0.55), transparent 42%), linear-gradient(135deg, #8ec5ffd9, #c9a2ffd9);
  }
  .ab-lava i:nth-child(2) {
    right: 8px; top: 6px; width: 46px; height: 46px; animation-duration: 7s, 4.4s; animation-delay: .8s, .5s; animation-direction: normal, alternate-reverse;
    background: radial-gradient(circle at 32% 26%, hsl(0 0% 100% / 0.55), transparent 42%), linear-gradient(135deg, #ff9ad5d9, #ffd28fd9);
  }
  .ab-lava i:nth-child(3) {
    left: 46px; bottom: 4px; width: 38px; height: 38px; animation-duration: 7s, 3s; animation-delay: 1.6s, 1s;
    background: radial-gradient(circle at 32% 26%, hsl(0 0% 100% / 0.55), transparent 42%), linear-gradient(135deg, #9df2d0d9, #8ec5ffd9);
  }
  @keyframes lavaFloat { from { translate: 0 0; } to { translate: 16px -12px; } }

  /* 17 · Comet orb — a glowing orb races an oval track, trailing fading copies */
  .ab-comet { position: relative; width: 164px; height: 104px; }
  .ab-comet i {
    position: absolute; border-radius: 50%;
    background: conic-gradient(from 0deg, #8ec5ff, #c9a2ff, #ff9ad5, #ffd28f, #9df2d0, #8ec5ff);
    filter: saturate(1.3);
    offset-path: path('M32,52 C32,12 132,12 132,52 C132,92 32,92 32,52 Z');
    animation: abChase 2.4s cubic-bezier(.45, .1, .55, .9) infinite;
  }
  .ab-comet i:nth-child(1) { width: 26px; height: 26px; box-shadow: 0 0 18px hsl(275 80% 70% / .85), 0 0 38px hsl(210 90% 70% / .5); }
  .ab-comet i:nth-child(2) { width: 19px; height: 19px; animation-delay: -.07s; opacity: .6; }
  .ab-comet i:nth-child(3) { width: 14px; height: 14px; animation-delay: -.14s; opacity: .4; }
  .ab-comet i:nth-child(4) { width: 9px;  height: 9px;  animation-delay: -.21s; opacity: .25; }
  .ab-comet i:nth-child(5) { width: 5px;  height: 5px;  animation-delay: -.28s; opacity: .15; }

  /* 18 · Binary orbs — two glowing orbs whirl around each other while the pair bobs */
  .ab-binarywrap { animation: binaryBob 3.4s ease-in-out infinite alternate; }
  .ab-binary { position: relative; width: 110px; height: 110px; animation: abOrbit 2.1s linear infinite; }
  .ab-binary i { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px; border-radius: 50%; }
  .ab-binary i:nth-child(1) {
    transform: translateX(-32px);
    background: radial-gradient(circle at 32% 28%, hsl(0 0% 100% / .7), transparent 45%), linear-gradient(135deg, #8ec5ff, #c9a2ff);
    box-shadow: 0 0 16px hsl(220 90% 70% / .8); animation: binaryGlow 1.3s ease-in-out infinite alternate;
  }
  .ab-binary i:nth-child(2) {
    transform: translateX(32px);
    background: radial-gradient(circle at 32% 28%, hsl(0 0% 100% / .7), transparent 45%), linear-gradient(135deg, #ff9ad5, #ffd28f);
    box-shadow: 0 0 16px hsl(330 90% 72% / .8); animation: binaryGlow 1.3s ease-in-out infinite alternate-reverse;
  }
  .ab-binary .spark { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px #fff; animation: abPulse 1.05s ease-in-out infinite; }
  @keyframes binaryGlow { from { filter: brightness(.92) saturate(1); } to { filter: brightness(1.2) saturate(1.4); } }
  @keyframes binaryBob { from { transform: translateY(-9px); } to { transform: translateY(9px); } }

  /* 19 · Wandering orb — Lissajous drift: never quite repeats, always on the move */
  .ab-liss { position: relative; width: 176px; height: 104px; }
  .ab-liss .lx { position: absolute; left: 0; top: 0; animation: lissX 2.3s cubic-bezier(.37, 0, .63, 1) infinite alternate; }
  .ab-liss .ly { animation: lissY 1.7s cubic-bezier(.37, 0, .63, 1) infinite alternate; }
  .ab-liss .orb {
    width: 26px; height: 26px; border-radius: 50%;
    background: conic-gradient(from 0deg, #8ec5ff, #c9a2ff, #ff9ad5, #ffd28f, #9df2d0, #8ec5ff);
    box-shadow: 0 0 16px hsl(275 80% 70% / .8), 0 0 34px hsl(210 90% 70% / .45);
    animation: glassSpin 4s linear infinite, lissHue 6s linear infinite;
  }
  @keyframes lissX { from { transform: translateX(0); } to { transform: translateX(148px); } }
  @keyframes lissY { from { transform: translateY(0); } to { transform: translateY(76px); } }
  @keyframes lissHue { to { filter: hue-rotate(360deg) saturate(1.3); } }

  /* ─── PLAIN skin — pure white chat, for animations shown on white ─── */
  .card.plain {
    --primary: 244 60% 56%;
    --chat-text: 220 18% 16%;
    --chat-text-muted: 220 10% 45%;
    --chat-glow: 244 60% 56% / 0.14;
    background: #fff;
  }
  .card.plain .chat-bg { display: none; }
  .card.plain .chat-glass { background: hsl(220 16% 96%); box-shadow: 0px 1px 2px hsl(220 20% 20% / 0.1); }
  .card.plain .header svg.lucide { stroke: #2b2f3a; }
  .card.plain .track-pill span { color: #2b2f3a; }
  .card.plain .chat-glass-input { background: hsl(220 16% 97%); box-shadow: 0px 1px 3px hsl(220 20% 20% / 0.1); }
  .plain-logo { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: 5px; color: #23262f; text-align: center; padding-left: 5px; }

  /* 3b/3c · Ripple variants — same dot field, different wave origins */
  .ab-field.diag i { animation-name: abRipple; }   /* delays set inline per pattern */
  .ab-field.on-white i { background: hsl(244 60% 60%); }
  .ab-field.on-white i.alt { background: hsl(330 80% 68%); }
  /* radar sweep: dots brighten as an invisible arm rotates past them */
  @keyframes abSweepDot { 0%, 100% { transform: scale(.4); opacity: .18; } 12% { transform: scale(1.45); opacity: 1; } 32% { transform: scale(.6); opacity: .35; } }
  /* slow spiral sweep: a sharp flash with a long fade, so only one or two dots glow at once */
  @keyframes abSweepSlow {
    0%      { transform: scale(.42); opacity: .12; }
    4%      { transform: scale(1.6);  opacity: 1; }   /* flash */
    14%     { transform: scale(.85);  opacity: .45; } /* lingering afterglow */
    30%     { transform: scale(.5);   opacity: .18; }
    100%    { transform: scale(.42);  opacity: .12; }
  }

  /* 6b · Loop-de-loop train — dots race a rounded racetrack, bunching on the curves */
  .ab-track2 { position: relative; width: 176px; height: 104px; }
  .ab-track2 i {
    position: absolute; border-radius: 50%;
    offset-path: path('M34,20 L142,20 A32,32 0 0 1 142,84 L34,84 A32,32 0 0 1 34,20 Z');
    animation: abChase 2.9s cubic-bezier(.5, .05, .5, .95) infinite; /* speeds up on straights */
  }
  .ab-track2 i:nth-child(1) { width: 16px; height: 16px; background: hsl(244 60% 58%); }
  .ab-track2 i:nth-child(2) { width: 14px; height: 14px; background: hsl(268 66% 62%); animation-delay: -.12s; }
  .ab-track2 i:nth-child(3) { width: 12px; height: 12px; background: hsl(320 74% 66%); animation-delay: -.24s; }
  .ab-track2 i:nth-child(4) { width: 10px; height: 10px; background: hsl(346 82% 70%); animation-delay: -.36s; }
  .ab-track2 i:nth-child(5) { width: 8px;  height: 8px;  background: hsl(30 88% 66%);  animation-delay: -.48s; }
  .ab-track2 i:nth-child(6) { width: 6px;  height: 6px;  background: hsl(170 62% 52%); animation-delay: -.6s; }
  .ab-track2::before { /* faint racetrack guide */
    content: ""; position: absolute; left: 34px; top: 20px; width: 108px; height: 64px;
    border: 1.5px dashed hsl(244 30% 82%); border-radius: 32px;
  }

  /* 8c · Teetering tower — many blocks, alternating offsets, wobbles then topples */
  .ab-tower { position: relative; width: 96px; height: 168px; }
  .stage.on .ab-tower { animation: towerLean 10s cubic-bezier(.4, 0, .5, 1) infinite; transform-origin: bottom center; }
  @keyframes towerLean { /* the whole stack sways as it gets taller, then gives up */
    0%, 12%   { transform: rotate(0deg); }
    30%       { transform: rotate(-1.6deg); }
    46%       { transform: rotate(2deg); }
    58%       { transform: rotate(-2.6deg); }
    66%       { transform: rotate(3.4deg); }
    72%       { transform: rotate(-4deg); }
    78%       { transform: rotate(5deg); }
    88%, 100% { transform: rotate(16deg) translateY(10px); }
  }
  .ab-tower i {
    position: absolute; left: var(--x); bottom: var(--b); width: var(--w); height: 17px;
    border-radius: 4px; background: var(--c); opacity: 0;
    box-shadow: 0 1px 3px hsl(220 25% 25% / 0.22);
  }
  .stage.on .ab-tower i { animation: towerBlock 10s cubic-bezier(.45, 0, .55, 1) infinite; animation-delay: var(--d); }
  @keyframes towerBlock {
    0%       { transform: translateY(-150px) rotate(-8deg); opacity: 0; }
    5%       { transform: translateY(0) scale(1.05, .8); opacity: 1; } /* lands with a squash */
    8%       { transform: translateY(0) scale(1, 1); }
    82%      { transform: translateY(0) rotate(0deg); opacity: 1; }
    93%, 100% { transform: translate(var(--sx), 116px) rotate(var(--sr)); opacity: 0; } /* topples off */
  }

  /* 20 · Orbit → chase morph (black & greys). The concentric orbits stretch open into a
     figure-eight track, a conga line runs it, then it collapses back into orbits. 10s loop. */
  .ab-morph { position: relative; width: 168px; height: 104px; }
  .ab-morph > div { position: absolute; inset: 0; }
  /* — phase A: orbits — */
  .mo-rings { display: grid; place-items: center; animation: moRingsPhase 10s cubic-bezier(.5, 0, .5, 1) infinite; transform-origin: center; }
  /* rings are made of DOTS (same vocabulary as the chase train) so the morph reads as one idea */
  .mo-rings .ring { position: absolute; border-radius: 50%; animation: abOrbit linear infinite; }
  .mo-rings .ring:nth-child(1) { width: 96px; height: 96px; animation-duration: 3s; }
  .mo-rings .ring:nth-child(2) { width: 66px; height: 66px; animation-duration: 2.1s; animation-direction: reverse; }
  .mo-rings .ring:nth-child(3) { width: 38px; height: 38px; animation-duration: 4.2s; }
  .mo-rings .ring b { /* many mini dots trace each ring, so the circle reads clearly */
    position: absolute; left: 50%; top: 50%; border-radius: 50%;
    transform: rotate(var(--a)) translateY(calc(var(--r) * -1)) translate(-50%, -50%);
  }
  .mo-rings .ring:nth-child(1) b { --r: 48px; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; }
  .mo-rings .ring:nth-child(2) b { --r: 33px; width: 6px; height: 6px; margin: -3px 0 0 -3px; }
  .mo-rings .ring:nth-child(3) b { --r: 19px; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; }
  .mo-rings .core { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #111; animation: abPulse 1.9s ease-in-out infinite; }
  @keyframes moRingsPhase { /* PHASE 2: rings condense out of the wide track and settle into orbit */
    0%, 40%   { transform: scaleX(1.7); opacity: 0; }
    52%       { transform: scaleX(1.12); opacity: .6; } /* pulled inward from the track's width */
    60%, 88%  { transform: scaleX(1); opacity: 1; }     /* full circular orbit, spinning */
    96%, 100% { transform: scaleX(1.6); opacity: 0; }   /* stretches back out to become the track again */
  }
  /* — phase B: the chase train — */
  .mo-train { animation: moTrainPhase 10s cubic-bezier(.5, 0, .5, 1) infinite; transform-origin: center; }
  .mo-train .guide { display: none; } /* no guide line — just the dots */
  .mo-train i {
    position: absolute; border-radius: 50%;
    offset-path: path('M34,52 C34,18 80,18 84,52 C88,86 134,86 134,52 C134,18 88,18 84,52 C80,86 34,86 34,52 Z');
    animation: abChase 2.6s linear infinite;
  }
  .mo-train i:nth-of-type(1) { width: 15px; height: 15px; background: #111; }
  .mo-train i:nth-of-type(2) { width: 13px; height: 13px; background: #3d3d3d; animation-delay: -.13s; }
  .mo-train i:nth-of-type(3) { width: 11px; height: 11px; background: #6b6b6b; animation-delay: -.26s; }
  .mo-train i:nth-of-type(4) { width: 9px;  height: 9px;  background: #949494; animation-delay: -.39s; }
  .mo-train i:nth-of-type(5) { width: 7px;  height: 7px;  background: #bdbdbd; animation-delay: -.52s; }
  @keyframes moTrainPhase { /* PHASE 1: the train runs the figure-eight, then squeezes into the orbit */
    0%, 34%   { transform: scaleX(1) scaleY(1); opacity: 1; }
    46%       { transform: scaleX(.42) scaleY(.95); opacity: .3; } /* collapses toward the center */
    54%, 88%  { transform: scaleX(.35) scaleY(.9); opacity: 0; }
    97%       { transform: scaleX(.9) scaleY(1); opacity: .5; }    /* re-opens for the next lap */
    100%      { transform: scaleX(1) scaleY(1); opacity: 1; }
  }

  /* 21 · Shape hopscotch II — dark grey on white, 8 hops in 10s, a different morph each bounce */
  .ab-hop2 { position: relative; width: 64px; height: 116px; }
  .ab-hop2 .hopper2 {
    position: absolute; bottom: 14px; left: 10px; width: 44px; height: 44px; background: #3a3a3a;
    box-shadow: 0 3px 9px hsl(0 0% 20% / 0.28);
  }
  .stage.on .ab-hop2 .hopper2 { animation: hop2 10s cubic-bezier(.38, 0, .6, 1) infinite; }
  @keyframes hop2 { /* land (squash) → apex (new shape) → land (settle into it) … 8 times */
    0%      { transform: translateY(0) scale(1.3, .72) rotate(0deg);      border-radius: 50%; }
    6%      { transform: translateY(-54px) scale(1) rotate(48deg);        border-radius: 32%; }
    12.5%   { transform: translateY(0) scale(1.28, .74) rotate(90deg);    border-radius: 32%; }
    18.5%   { transform: translateY(-50px) scale(1) rotate(140deg);       border-radius: 24% 76% 65% 35% / 62% 30% 70% 38%; }
    25%     { transform: translateY(0) scale(1.3, .72) rotate(180deg);    border-radius: 24% 76% 65% 35% / 62% 30% 70% 38%; }
    31%     { transform: translateY(-56px) scale(1) rotate(232deg);       border-radius: 12%; }
    37.5%   { transform: translateY(0) scale(1.26, .76) rotate(270deg);   border-radius: 12%; }
    43.5%   { transform: translateY(-48px) scale(1) rotate(318deg);       border-radius: 50% 50% 44% 56% / 62% 62% 38% 38%; }
    50%     { transform: translateY(0) scale(1.3, .72) rotate(360deg);    border-radius: 50% 50% 44% 56% / 62% 62% 38% 38%; }
    56%     { transform: translateY(-52px) scale(1) rotate(410deg);       border-radius: 4% 50% 50% 50%; }
    62.5%   { transform: translateY(0) scale(1.28, .74) rotate(450deg);   border-radius: 4% 50% 50% 50%; }
    68.5%   { transform: translateY(-58px) scale(1) rotate(500deg);       border-radius: 50% 4% 50% 4%; }
    75%     { transform: translateY(0) scale(1.32, .7) rotate(540deg);    border-radius: 50% 4% 50% 4%; }
    81%     { transform: translateY(-46px) scale(1) rotate(586deg);       border-radius: 46% / 26%; }
    87.5%   { transform: translateY(0) scale(1.26, .76) rotate(630deg);   border-radius: 46% / 26%; }
    93.5%   { transform: translateY(-54px) scale(1) rotate(680deg);       border-radius: 50%; }
    100%    { transform: translateY(0) scale(1.3, .72) rotate(720deg);    border-radius: 50%; }
  }
  .ab-hop2::after { /* landing shadow, breathing opposite each hop */
    content: ""; position: absolute; left: 12px; bottom: 6px; width: 40px; height: 7px;
    border-radius: 50%; background: hsl(0 0% 25% / 0.26);
  }
  .stage.on .ab-hop2::after { animation: hop2Shadow 1.25s cubic-bezier(.38, 0, .6, 1) infinite alternate; }
  @keyframes hop2Shadow { 0% { transform: scale(1.25); opacity: .85; } 100% { transform: scale(.45); opacity: .2; } }

  /* ─── Conveyor stop — skeleton product carousel that halts on real picks ─── */
  .conv { margin-top: 6px; overflow: hidden; position: relative; }
  .conv-track { display: flex; gap: 8px; will-change: transform; }
  .conv-card {
    flex: none; background: #fff; border-radius: 10px; overflow: hidden;
    box-shadow: 0 2px 6px hsl(0 0% 0% / 0.14); transition: box-shadow .5s;
  }
  .conv-img { height: 56px; position: relative; overflow: hidden; }
  .conv-real {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 24px; opacity: 0; transform: scale(0.7); background: #fff;
  }
  .conv-real img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .conv-card.reveal .conv-real {
    transition: opacity .4s, transform .5s cubic-bezier(.2,1.4,.4,1);
    opacity: 1; transform: scale(1);
  }
  .conv-info { padding: 6px 7px 8px; }
  .conv-txt { opacity: 0; }
  .conv-card.reveal .conv-txt { transition: opacity .35s .15s; opacity: 1; }
  .conv-name { font-size: 8.5px; font-weight: 600; color: #1c1f26; line-height: 1.25; height: 21px; overflow: hidden; }
  .conv-price { font-size: 8.5px; color: #6b7280; margin-top: 2px; }
  .conv-price b { color: #1c1f26; }
  .conv-card.reveal .cbar { display: none; }
  .conv-card.reveal .csk::after { display: none; } /* loaded cards are static — no shimmer over the product */
  /* the card currently being loaded: faster shimmer + soft highlight ring */
  .conv-card.loading { box-shadow: 0 0 0 2px hsl(0 0% 100% / 0.85), 0 2px 10px hsl(0 0% 0% / 0.2); }
  .conv-card.loading .csk::after { animation-duration: 0.5s; }
  .csk { background: #e9ebf1; position: relative; overflow: hidden; }
  .csk::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, hsl(0 0% 100% / 0.85), transparent);
    transform: translateX(-100%); animation: conv-shim 1.3s infinite;
  }
  @keyframes conv-shim { to { transform: translateX(100%); } }
  .cbar { height: 6px; border-radius: 3px; margin-top: 4px; }
  .cbar.w80 { width: 80%; }
  .cbar.w50 { width: 50%; }
  .conv-reply {
    display: none; height: 18px; line-height: 18px; padding-left: 8px; margin-top: 4px;
    font-size: 11px; font-weight: 500; color: hsl(var(--chat-text)); white-space: nowrap;
  }
  /* typed assistant response — replaces the product grid */
  .reply-body {
    display: none; margin-top: 6px; padding: 9px 12px; border-radius: 14px 14px 14px 4px;
    background: hsl(0 0% 100% / 0.5); font-size: 11.5px; line-height: 1.5;
    color: hsl(var(--chat-text)); min-height: 92px;
  }
  .reply-body .caret {
    display: inline-block; width: 1.5px; height: 11px; margin-left: 1px; vertical-align: -1px;
    background: currentColor; animation: caretBlink .9s steps(1) infinite;
  }
  @keyframes caretBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  /* ─── Sequential 2×2 grid (Toys R Us): skeletons in 1-4, out 4-2-3-1, products in 1-3 ─── */
  .grid4 { margin-top: 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid4 .conv-card { opacity: 0; transform: scale(0.92); transition: opacity .35s ease, transform .35s ease; }
  .grid4 .conv-card.show { opacity: 1; transform: none; }
  .grid4 .conv-img { height: 64px; }
  /* while loading, image slots preview rotating products (text stays skeleton) */
  .grid4 .conv-card.cycling .conv-real { opacity: 1; transform: none; }
  .grid4 .conv-card.cycling .csk::after { display: none; }

  /* ─── Dual-row swipe carousel (Sami): 2×2 grid of skeletons. Cards hold, then a quick
     eased swipe pushes each row over one position — rows offset so they alternate. ─── */
  .belt2 {
    margin-top: 6px; opacity: 0; transform: translateY(10px);
    transition: opacity .35s, transform .4s cubic-bezier(.2, 1.2, .4, 1); /* same entrance as the sent message */
  }
  .belt2.on { opacity: 1; transform: none; }
  /* thinking indicator + AI reply ease in the same way whenever they (re)appear */
  .phrase-window, .conv-reply { animation: fadeUpIn .4s cubic-bezier(.2, 1.2, .4, 1) both; }
  @keyframes fadeUpIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }
  .belt2 .conv + .conv { margin-top: 8px; }
  /* user message "sends" at the start of each round, then loading begins */
  .user-row { opacity: 0; transform: translateY(10px) scale(0.95); transition: opacity .35s, transform .4s cubic-bezier(.2, 1.2, .4, 1); }
  .user-row.sent { opacity: 1; transform: none; }
  /* Toys R Us variant: cards carry product photos while loading (text stays skeleton) */
  .belt2 .conv-card.cycling .conv-real { opacity: 1; transform: none; }
  .belt2 .conv-card.cycling .csk::after { display: none; }
  .belt2 .conv-card.dim { opacity: 0; transform: scale(0.9); transition: opacity .4s, transform .4s; }
  /* loaded product cards swipe in with the same push the belt uses, keeping the momentum */
  .belt2 .conv-card.swipe-in { animation: swipeInCard .75s cubic-bezier(.3, 1.35, .45, 1) both; }
  @keyframes swipeInCard {
    from { opacity: 0; transform: translateX(96px); }
    to   { opacity: 1; transform: none; }
  }

  /* ─── Falling product photos (Parachute): images drop in and bounce while loading ─── */
  .fall-stage {
    margin-top: 6px; height: 120px; border-radius: 12px; position: relative; overflow: hidden;
    background: hsl(40 33% 97% / 0.35); transition: opacity .35s;
  }
  .fall-stage.hide { opacity: 0; }
  .fall-ball {
    position: absolute; left: 0; top: 0; width: 38px; height: 38px; border-radius: 50%;
    overflow: hidden; background: #fff; box-shadow: 0 2px 6px hsl(0 0% 0% / 0.18); will-change: transform;
  }
  .fall-ball img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fall-cards { display: none; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 8px; }
  .fall-cards .conv-card { opacity: 0; transform: scale(0.92); transition: opacity .35s ease, transform .35s ease; }
  .fall-cards .conv-card.show { opacity: 1; transform: none; }

  /* ─── Spinning "breathing" loader (Glamnetic): orb + rotating loading text ─── */
  .spin-stage {
    margin-top: 6px; height: 120px; border-radius: 12px; background: hsl(0 0% 100% / 0.14);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    transition: opacity .35s;
  }
  .spin-stage.hide { opacity: 0; }
  .g-orb { width: 34px; height: 34px; animation: gbreathe 1.8s ease-in-out infinite; }
  .g-ring {
    width: 100%; height: 100%; border-radius: 50%;
    border: 3px solid hsl(0 0% 100% / 0.3); border-top-color: #fff;
    animation: gspin 0.9s linear infinite;
  }
  @keyframes gspin { to { transform: rotate(360deg); } }
  @keyframes gbreathe { 0%, 100% { transform: scale(0.85); } 50% { transform: scale(1.12); } }
  .spin-text { font-size: 11px; font-weight: 500; color: #fff; height: 16px; transition: opacity .3s; }

  /* ─── Round 2 shared: loading stage + 2×2 finals grid ─── */
  .stage {
    margin-top: 6px; border-radius: 12px; background: hsl(0 0% 100% / 0.14);
    position: relative; overflow: hidden; height: 170px;
    opacity: 0; transform: translateY(10px);
    transition: opacity .35s, transform .4s cubic-bezier(.2, 1.2, .4, 1), height .45s cubic-bezier(.5, 0, .2, 1);
  }
  .stage.on { opacity: 1; transform: none; }
  .stage.hide { opacity: 0; }
  /* fixed 230px finals grid — identical to the loading stage height by construction,
     so the handoff can never shift the chat */
  .finals {
    display: none; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(2, 1fr);
    gap: 8px; margin-top: 6px; height: 230px;
  }
  .finals .conv-card { opacity: 0; }
  .finals .conv-img { height: 58px; }
  /* finals cells keep IDENTICAL height in skeleton, veiled and revealed states: the bars
     overlay the (hidden) text instead of adding their own height, so nothing ever shifts */
  .finals .conv-info { position: relative; }
  .finals .cbar { position: absolute; left: 7px; margin-top: 0; }
  .finals .cbar.w80 { top: 8px; width: 65%; }
  .finals .cbar.w50 { top: 20px; width: 42%; }
  .conv-card.swipe-any { animation: swipeInCard .75s cubic-bezier(.3, 1.35, .45, 1) both; }
  /* gentler entrance for handoffs that should feel continuous, not like a scene change */
  .conv-card.fade-any { animation: fadeInCard .7s cubic-bezier(.25, .8, .3, 1) both; position: relative; }
  @keyframes fadeInCard {
    from { opacity: 0; transform: translateY(12px) scale(0.96); }
    to   { opacity: 1; transform: none; }
  }
  /* one-shot cross-fade shimmer as each final card lands — makes it read as a reveal */
  .conv-card.fade-any::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 35%, hsl(0 0% 100% / 0.7) 50%, transparent 65%);
    transform: translateX(-120%);
    animation: revealShimmer .9s ease-out .3s 1 both;
  }
  @keyframes revealShimmer { to { transform: translateX(120%); } }

  /* A · Deal & discard */
  .pk-card {
    position: absolute; left: 50%; top: 40%; width: 72px; height: 72px; margin: -36px 0 0 -36px;
    border-radius: 12px; overflow: hidden; background: #fff; box-shadow: 0 3px 10px hsl(0 0% 0% / 0.25);
    opacity: 0; transform: scale(0.5);
    transition: transform .4s cubic-bezier(.25, 1.2, .4, 1), opacity .3s;
  }
  .pk-card img { width: 100%; height: 100%; object-fit: cover; }
  .pk-card.in { opacity: 1; transform: scale(1); }
  .pk-card.in.considering { animation: pkConsider .55s ease-in-out; }
  @keyframes pkConsider { 0%, 100% { rotate: 0deg; } 30% { rotate: -3.5deg; } 70% { rotate: 3deg; } }
  .pk-card.toss { opacity: 0; transform: translateX(-150px) rotate(-22deg) scale(0.85); }
  .pk-slots { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; }
  .pk-slot { width: 32px; height: 32px; border-radius: 9px; border: 1.5px dashed hsl(0 0% 100% / 0.5); position: relative; }
  .pk-slot.filled { border-style: solid; border-color: #fff; }
  .pk-slot.filled::after { content: "✓"; position: absolute; right: -4px; top: -7px; font-size: 10px; color: #fff; font-weight: 700; }

  /* B · Focus scan (no box/frame). The stage reserves the exact height the finals will occupy
     (~230px, measured at runtime) and the compact 2×3 tile grid floats centered inside it —
     so the chat never gets bumped when the finals land. overflow visible so focused cards
     can scale up without getting cropped */
  .stage.scan, .stage.scan2 { background: none; height: 230px; overflow: visible; display: flex; align-items: center; }
  .sc-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; padding: 0; width: 248px; margin: 0 auto;
  }
  .sc-thumb {
    width: 100%; aspect-ratio: 1 / 1; border-radius: 11px; overflow: hidden; background: #fff;
    opacity: 0; transform: scale(0.7); transition: opacity .3s, transform .35s cubic-bezier(.2, 1.3, .4, 1), filter .3s;
  }
  .sc-thumb img { width: 100%; height: 100%; object-fit: cover; transition: opacity .22s; }
  /* flight clones: winners glide from grid spot to final slot; width/height animate and the
     image re-crops via object-fit, so the card never distorts or smushes */
  .fly-card {
    position: absolute; z-index: 6; border-radius: 11px; overflow: hidden; background: #fff;
    box-shadow: 0 3px 10px hsl(0 0% 0% / 0.22);
    transition: left .7s cubic-bezier(.45, .05, .25, 1), top .7s cubic-bezier(.45, .05, .25, 1),
                width .7s cubic-bezier(.45, .05, .25, 1), height .7s cubic-bezier(.45, .05, .25, 1);
  }
  .fly-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* veiled finals: the landed card is a full skeleton (shimmer image + bars), then the
     product image and text plop in together */
  .conv-card.reveal.veiled .conv-real { opacity: 0; transform: scale(1); transition: none; }
  .conv-card.reveal.veiled .conv-txt { opacity: 0; transition: none; }
  .conv-card.reveal.veiled .cbar { display: block; }
  .conv-card.reveal.veiled .csk::after { display: block; }
  .sc-thumb.in { opacity: 0.45; transform: scale(1); }
  .sc-thumb.in.focus { opacity: 1; transform: scale(1.16); box-shadow: 0 0 0 2.5px #fff, 0 4px 12px hsl(0 0% 0% / 0.3); z-index: 2; }
  .sc-thumb.in.out { opacity: 0.12; filter: grayscale(1); transform: scale(0.88); }
  .sc-thumb.in.win { opacity: 1; }

  /* C · Score & sort */
  .sr-row {
    display: flex; align-items: center; gap: 8px; padding: 5px 12px;
    opacity: 0; transform: translateX(-10px); transition: opacity .3s, transform .35s;
  }
  .sr-row.in { opacity: 1; transform: none; }
  .sr-row.drop { opacity: 0.22; }
  .sr-thumb { width: 26px; height: 26px; border-radius: 7px; overflow: hidden; background: #fff; flex: none; }
  .sr-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .sr-meter { flex: 1; height: 5px; border-radius: 3px; background: hsl(0 0% 100% / 0.25); overflow: hidden; }
  .sr-meter i { display: block; height: 100%; width: 0; border-radius: 3px; background: #fff; transition: width 1s cubic-bezier(.3, 0, .2, 1); }
  .sr-pct { width: 30px; font-size: 10px; font-weight: 600; color: #fff; text-align: right; font-variant-numeric: tabular-nums; }
  .sr-row .sr-check { width: 12px; font-size: 10px; color: #fff; font-weight: 700; opacity: 0; }
  .sr-row.win .sr-check { opacity: 1; }

  /* D · Universal loader (no product data, no frame) */
  .stage.orb { height: 140px; background: none; }
  /* sequential loading phrases — each appears alone and disappears before the next */
  .phrase-seq {
    height: 18px; line-height: 18px; padding-left: 8px; margin-top: 4px; font-size: 11px; font-weight: 500;
    color: hsl(var(--primary)); white-space: nowrap; opacity: 0; transition: opacity .35s;
  } /* margin matches .conv-reply so the phrase → reply swap doesn't shift the chat */
  .ob-wrap { position: absolute; left: 50%; top: 58px; width: 0; height: 0; }
  .ob-star { position: absolute; left: -13px; top: -15px; font-size: 26px; color: #fff; animation: obBreathe 1.8s ease-in-out infinite; }
  @keyframes obBreathe { 0%, 100% { transform: scale(0.82) rotate(0deg); opacity: .8; } 50% { transform: scale(1.15) rotate(18deg); opacity: 1; } }
  .ob-ring { position: absolute; left: -30px; top: -30px; width: 60px; height: 60px; animation: gspin 2.6s linear infinite; }
  .ob-ring i { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%; background: hsl(0 0% 100% / 0.85); }
  .ob-ring i:nth-child(1) { transform: rotate(0deg) translateY(-28px); }
  .ob-ring i:nth-child(2) { transform: rotate(120deg) translateY(-28px); opacity: .65; }
  .ob-ring i:nth-child(3) { transform: rotate(240deg) translateY(-28px); opacity: .4; }
  .ob-copy { position: absolute; left: 0; right: 0; top: 88px; text-align: center; font-size: 11px; font-weight: 500; color: #fff; transition: opacity .3s; }
  .ob-bar { position: absolute; left: 24px; right: 24px; bottom: 14px; height: 3px; border-radius: 2px; background: hsl(0 0% 100% / 0.25); overflow: hidden; }
  .ob-bar i { position: absolute; top: 0; bottom: 0; width: 34%; border-radius: 2px; background: #fff; animation: obSweep 1.4s ease-in-out infinite; }
  @keyframes obSweep { 0% { left: -34%; } 100% { left: 100%; } }

  /* D2 · Chase train + universal-loader copy & sweep line */
  .stage.ctrain { height: 150px; background: none; }
  .ct-track { position: relative; width: 160px; height: 96px; margin: 0 auto; }
  .ct-track i {
    position: absolute; border-radius: 50%; background: #fff;
    offset-path: path('M30,48 C30,16 76,16 80,48 C84,80 130,80 130,48 C130,16 84,16 80,48 C76,80 30,80 30,48 Z');
    animation: abChase 3.4s linear infinite;
  }
  .ct-track i:nth-child(1) { width: 15px; height: 15px; }
  .ct-track i:nth-child(2) { width: 12px; height: 12px; opacity: .85; animation-delay: -.15s; }
  .ct-track i:nth-child(3) { width: 10px; height: 10px; opacity: .7;  animation-delay: -.3s; }
  .ct-track i:nth-child(4) { width: 8px;  height: 8px;  opacity: .55; animation-delay: -.45s; }
  .ct-track i:nth-child(5) { width: 6px;  height: 6px;  opacity: .4;  animation-delay: -.6s; }
  .ct-copy { position: absolute; left: 0; right: 0; top: 100px; text-align: center; font-size: 11px; font-weight: 500; color: #fff; opacity: 0; transition: opacity .3s; }
  .ct-bar { position: absolute; left: 24px; right: 24px; bottom: 14px; height: 3px; border-radius: 2px; background: hsl(0 0% 100% / 0.25); overflow: hidden; }
  .ct-bar i { position: absolute; top: 0; bottom: 0; width: 34%; border-radius: 2px; background: #fff; animation: obSweep 1.4s ease-in-out infinite; }

  /* E · Collapse tray */
  .stage.tray { height: 84px; }
  .stage.tray.collapsed { height: 34px; background: hsl(0 0% 100% / 0.22); }
  .ty-track { display: flex; gap: 8px; padding: 10px; width: max-content; animation: tyMarquee 16s linear infinite; transition: opacity .3s; }
  @keyframes tyMarquee { to { transform: translateX(-50%); } }
  .ty-tile { width: 64px; height: 64px; border-radius: 11px; overflow: hidden; background: #fff; flex: none; box-shadow: 0 2px 6px hsl(0 0% 0% / 0.18); }
  .ty-tile img { width: 100%; height: 100%; object-fit: cover; }
  .stage.tray.collapsed .ty-track { opacity: 0; }
  .ty-pill {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 7px;
    font-size: 10.5px; font-weight: 600; color: #fff; opacity: 0; transition: opacity .35s .2s;
  }
  .stage.tray.collapsed .ty-pill { opacity: 1; }
  .ty-thumbs { display: flex; }
  .ty-thumbs img { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #fff; object-fit: cover; margin-left: -7px; }
  .ty-thumbs img:first-child { margin-left: 0; }

  /* F · Criteria match — chips are the framework; swap them per vertical (toys, skincare, apparel…) */
  .stage.match { height: 130px; }
  .mt-chips { display: flex; justify-content: center; gap: 6px; padding-top: 18px; flex-wrap: wrap; }
  .mt-chip {
    font-size: 10.5px; font-weight: 600; color: #0a57d6; background: #fff; border-radius: 99px; padding: 4px 10px;
    opacity: 0; transform: scale(0.6);
    transition: opacity .3s, transform .4s cubic-bezier(.2, 1.5, .4, 1), box-shadow .3s;
  }
  .mt-chip.in { opacity: 1; transform: scale(1); }
  .mt-chip.active { box-shadow: 0 0 0 2.5px hsl(0 0% 100% / 0.85); transform: scale(1.07); }
  .mt-thumbs { position: absolute; left: 0; right: 0; bottom: 20px; display: flex; justify-content: center; gap: 7px; }
  .mt-thumb {
    width: 32px; height: 32px; border-radius: 9px; overflow: hidden; background: #fff; position: relative; flex: none;
    opacity: 0; transform: translateY(8px);
    transition: opacity .4s, transform .45s cubic-bezier(.2, 1.3, .4, 1), filter .4s;
  }
  .mt-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .mt-thumb.in { opacity: 1; transform: none; }
  .mt-thumb.cut { opacity: 0.15; filter: grayscale(1); transform: scale(0.82); }
  .mt-thumb.ok::after {
    content: "✓"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: #fff; background: hsl(220 70% 20% / 0.4);
    animation: mtOk .4s cubic-bezier(.2, 1.4, .4, 1);
  }
  @keyframes mtOk { from { opacity: 0; transform: scale(1.5); } to { opacity: 1; transform: scale(1); } }

  /* G · Shuffle deal — cards shuffle positions while loading; photos deal on mid-shuffle (no frame) */
  .stage.shuffle { height: 190px; background: none; }
  .sh-card {
    position: absolute; left: 0; top: 0; border-radius: 10px; background: #fff; overflow: hidden;
    box-shadow: 0 2px 6px hsl(0 0% 0% / 0.18);
    transition: transform .55s cubic-bezier(.35, .1, .25, 1.1);
  }
  .sh-card .conv-img { height: 44px; }
  .sh-card .conv-real { opacity: 0; transform: none; transition: opacity .55s; }
  .sh-card.pic .conv-real { opacity: 1; }
  .sh-card.pic .csk::after { display: none; }
</style>
</head>

  const isOsea = brand === 'osea';

                : isToysrus ? "What's a good gift for a 5-year-old?"
                : isGlamnetic ? 'How long do the press-ons last?'
                : isOsea ? 'Which body oil is best for dry skin?'
                : isAtelier ? 'Womens dresses for a wedding'
                : isPlain ? "What's a good gift for a 5-year-old?"
                : 'Help me find the right size';

// drive the sequential phrases: fade in → dwell → fade fully out → next
// (data-set elements are driven by their own engine instead, so timing stays synced)
document.querySelectorAll('.phrase-seq').forEach(el => {
  if (el.dataset.set) return;
  let i = 0;
  el.textContent = huntPhrases[0];
  el.style.opacity = 1;
  (async function loop() {
    while (true) {
      await new Promise(r => setTimeout(r, 1500));
      el.style.opacity = 0;
      await new Promise(r => setTimeout(r, 420));
      i = (i + 1) % huntPhrases.length;
      el.textContent = huntPhrases[i];
      el.style.opacity = 1;
    }
  })();
});

document.querySelectorAll('.phrase-type').forEach(el => {
  let i = 0;
  const waveStep = 70;    // stagger while typing in (left → right wave)
  const delStep = 45;     // stagger while deleting (right → left, snappier)
  const typeDur = 550, delDur = 280, dwellMs = 1300;

  function typeIn() {
    const text = phrases[i];
    el.innerHTML = '';
    const spans = [...text].map((c, idx) => {
      const s = document.createElement('span');
      s.className = 'ch';
      s.textContent = c;
      s.style.animationDelay = (idx * waveStep) + 'ms';
      el.appendChild(s);
      return s;
    });
    setTimeout(() => deleteOut(spans), text.length * waveStep + typeDur + dwellMs);
  }

  function deleteOut(spans) {
    const n = spans.length;
    spans.forEach((s, idx) => {
      s.style.animationDelay = ((n - 1 - idx) * delStep) + 'ms';  // backspace: last letter first
      s.classList.add('deleting');
    });
    setTimeout(() => { i = (i + 1) % phrases.length; typeIn(); }, n * delStep + delDur);
  }

  typeIn();
});

// Glamnetic variation: GSAP SplitText character animation (slide in from right, power4, staggered)
document.querySelectorAll('.phrase-split').forEach(el => {
  if (!window.gsap) { el.textContent = glamneticPhrases[0]; return; }
  const useSplit = !!window.SplitText;
  if (useSplit) gsap.registerPlugin(SplitText);
  let i = 0;
  function play() {
    const text = glamneticPhrases[i];
    let chars, split;
    if (useSplit) {
      el.textContent = text;
      split = SplitText.create(el, { type: 'chars' });
      chars = split.chars;
    } else {
      el.innerHTML = '';
      chars = [...text].map(c => {
        const s = document.createElement('span');
        s.className = 'sc';
        s.textContent = c;
        el.appendChild(s);
        return s;
      });
    }
    // slide in from the right
    gsap.from(chars, { x: 50, opacity: 0, duration: 0.7, ease: 'power4', stagger: 0.04 });
    i = (i + 1) % glamneticPhrases.length;
    // after it settles + holds, slide out to the left, then play the next phrase
    setTimeout(() => {
      gsap.to(chars, {
        x: -50, opacity: 0, duration: 0.6, ease: 'power4.in', stagger: 0.04,
        onComplete: () => { if (split) split.revert(); play(); }
      });
    }, chars.length * 40 + 700 + 1500);
  }
  play();
});

});

// ─── Round 2 shared helpers: send message → run stage → finals swipe in → reset ───
const LOREM = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor ' +
  'incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud.';
function roundCtx(stage) {
  const convo = stage.closest('.convo');
  const brand = stage.dataset.brand || 'toysrus';
  return {
    stage, convo, brand,
    userRow: convo.querySelector('.user-row'),
    phraseEl: convo.querySelector('.phrase-window, .phrase-split, .phrase-type, .phrase-seq'),
    bodyEl: convo.querySelector('.reply-body'),
  };
}
// type the response out character by character, with a blinking caret
async function typeReply(ctx, holdMs = 2600) {
  const el = ctx.bodyEl;
  el.textContent = '';
  el.style.display = 'block';
  const caret = document.createElement('span');
  caret.className = 'caret';
  el.appendChild(caret);
  for (let i = 0; i < LOREM.length; i++) {
    caret.insertAdjacentText('beforebegin', LOREM[i]);
    await wait(LOREM[i] === ' ' ? 10 : 16);
  }
  caret.remove();
  await wait(holdMs);
  el.style.display = 'none';
  el.textContent = '';
}
async function introSend(ctx) {
  ctx.userRow.classList.remove('sent');
  ctx.stage.classList.remove('on', 'hide', 'collapsed');
  ctx.stage.style.display = '';
  if (ctx.bodyEl) { ctx.bodyEl.style.display = 'none'; ctx.bodyEl.textContent = ''; }
  if (ctx.phraseEl) ctx.phraseEl.style.display = 'none';
  await wait(700);
  ctx.userRow.classList.add('sent');   // message pops in
  await wait(650);
  if (ctx.phraseEl) ctx.phraseEl.style.display = '';
  ctx.stage.classList.add('on');       // loading stage eases in
  await wait(400);
}
async function hideStage(ctx) {
  ctx.stage.classList.add('hide');
  await wait(330);
  ctx.stage.style.display = 'none';
}
